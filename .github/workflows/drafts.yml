name: Szkice dokumentów

# Uruchamiany ręcznie: Actions -> Szkice dokumentów -> Run workflow.
# Przetwarza prośby o szkice zgłoszone w panelu oraz tworzy brakujące szkice, nie czekając na dzienny skan.
# Nie wysyła raportu e-mail.

on:
  workflow_dispatch:

concurrency:
  group: szkice
  cancel-in-progress: false

jobs:
  drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Przygotuj szkice
        run: node src/cli.js drafts
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
